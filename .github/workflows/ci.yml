name: Build and Deploy Backend

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/desbravadores-backend:latest

      - name: Start ssh-agent and add private key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: |
            ${{ secrets.DESBRAVADORES_SSH_KEY }}

      - name: Add hosts to known_hosts
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.BASTION_PUBLIC_IP }} >> ~/.ssh/known_hosts || true
          ssh-keyscan -H ${{ secrets.BACKEND_PRIVATE_IP_1 }} >> ~/.ssh/known_hosts || true
          ssh-keyscan -H ${{ secrets.BACKEND_PRIVATE_IP_2 }} >> ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Backend Instance 1
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyJump=ubuntu@${{ secrets.BASTION_PUBLIC_IP }} \
              ubuntu@${{ secrets.BACKEND_PRIVATE_IP_1 }} \
              "cd /home/ubuntu/backend && docker compose pull && docker compose up -d"

      - name: Deploy Backend Instance 2
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyJump=ubuntu@${{ secrets.BASTION_PUBLIC_IP }} \
              ubuntu@${{ secrets.BACKEND_PRIVATE_IP_2 }} \
              "cd /home/ubuntu/backend && docker compose pull && docker compose up -d"
